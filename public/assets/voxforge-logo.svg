<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Logo Container -->
  <g filter="url(#shadow)">
    
    <!-- Logo Symbol: Voice Waveform + Studio Tools -->
    <g transform="translate(0, 25)">
      
      <!-- Central sound wave -->
      <path d="M30,35 Q50,15 70,35 Q90,55 110,35 Q130,15 150,35 Q170,55 190,35 Q210,15 230,35 Q250,55 270,35" 
            fill="none" stroke="url(#logoGradient)" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Studio precision rings -->
      <circle cx="50" cy="35" r="15" fill="none" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.4"/>
      <circle cx="150" cy="35" r="15" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4"/>
      <circle cx="250" cy="35" r="15" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4"/>
      
      <!-- Creative spark elements -->
      <path d="M40,20 L45,15 L50,20 L45,25 Z" fill="#F97316" opacity="0.8"/>
      <path d="M140,20 L145,15 L150,20 L145,25 Z" fill="#10B981" opacity="0.8"/>
      <path d="M240,20 L245,15 L250,20 L245,25 Z" fill="#3B82F6" opacity="0.8"/>
      
    </g>
    
    <!-- Wordmark: VoxForge Studio -->
    <g transform="translate(280, 25)">
      <text x="0" y="35" font-family="'Segoe UI', 'Inter', sans-serif" font-size="36" font-weight="700" fill="#1F2937">
        <tspan fill="url(#logoGradient)">VoxForge</tspan>
        <tspan fill="#64748B" dx="10">Studio</tspan>
      </text>
      
      <!-- Subtle tagline -->
      <text x="0" y="60" font-family="'Segoe UI', 'Inter', sans-serif" font-size="14" font-weight="400" fill="#6B7280">
        Voice Crafting Workspace
      </text>
    </g>
    
  </g>
</svg>