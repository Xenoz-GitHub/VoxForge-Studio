<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="400" height="120" fill="#0F172A" rx="8"/>
  
  <!-- Main Logo Container -->
  <g filter="url(#glow)" transform="translate(0, 20)">
    
    <!-- Logo Symbol: Voice Waveform + Studio Tools -->
    <g transform="translate(0, 25)">
      
      <!-- Central sound wave with glow -->
      <path d="M30,35 Q50,15 70,35 Q90,55 110,35 Q130,15 150,35 Q170,55 190,35 Q210,15 230,35 Q250,55 270,35" 
            fill="none" stroke="url(#logoGradientDark)" stroke-width="5" stroke-linecap="round"/>
      
      <!-- Studio precision rings - subtle glow -->
      <circle cx="50" cy="35" r="15" fill="none" stroke="#FB923C" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="150" cy="35" r="15" fill="none" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="250" cy="35" r="15" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.6"/>
      
      <!-- Creative spark elements - brighter for dark mode -->
      <path d="M40,20 L45,15 L50,20 L45,25 Z" fill="#FB923C" opacity="0.9"/>
      <path d="M140,20 L145,15 L150,20 L145,25 Z" fill="#34D399" opacity="0.9"/>
      <path d="M240,20 L245,15 L250,20 L245,25 Z" fill="#60A5FA" opacity="0.9"/>
      
    </g>
    
    <!-- Wordmark: VoxForge Studio -->
    <g transform="translate(280, 25)">
      <text x="0" y="35" font-family="'Segoe UI', 'Inter', sans-serif" font-size="36" font-weight="700" fill="#F8FAFC">
        <tspan fill="url(#logoGradientDark)">VoxForge</tspan>
        <tspan fill="#CBD5E1" dx="10">Studio</tspan>
      </text>
      
      <!-- Subtle tagline -->
      <text x="0" y="60" font-family="'Segoe UI', 'Inter', sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
        Voice Crafting Workspace
      </text>
    </g>
    
  </g>
  
  <!-- Subtle noise texture -->
  <rect width="400" height="120" fill="url(#noisePattern)" opacity="0.03" rx="8"/>
  
</svg>