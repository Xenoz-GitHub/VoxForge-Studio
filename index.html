<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxForge Studio — Text-to-Speech &amp; Multi-Take Voice Studio</title>
    <meta
      name="description"
      content="General-purpose text-to-speech, batch audio generation, and multi-speaker voice studio powered by Gemini 3.8 Flash TTS."
    />
    <meta property="og:title" content="VoxForge Studio — Text-to-Speech &amp; Multi-Take Voice Studio" />
    <meta
      property="og:description"
      content="General-purpose text-to-speech, batch audio generation, and multi-speaker voice studio powered by Gemini 3.8 Flash TTS."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Favicons -->
    <link rel="icon" href="/assets/voxforge-icon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="msapplication-TileColor" content="#0F172A">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("voxforge_theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = saved ? saved === "dark" : prefersDark;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-orange-200 selection:text-slate-950 dark:selection:bg-orange-500/30 dark:selection:text-orange-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
